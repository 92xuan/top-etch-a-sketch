<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet", href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <label for="color-selector">Pen Color:</label>
    <select class="color-selector">
        <option value="black">Black</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="rainbow">Rainbow</option>
        <option value="eraser">Eraser</option>
    </select>

    <label for="opacity">Opacity (1-10)</label>
    <input type="number" id="opacity" value="10" min="1" max="10">

    <label for="resolution">Resolution (20-100)</label>
    <input type="number" id="resolution" value="40" min="20" max="100">

    <button class="reset-button">Reset</button>

    <div class="main-container"></div>
    
</body>
</html>
